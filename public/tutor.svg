<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
  <!-- bookplate-style mark of Profe Dirac — paper, ink and a clay rule -->
  <rect width="480" height="480" fill="#f7f4ec"/>
  <!-- paper grain suggestion: faint specks -->
  <g fill="#2f2b26" fill-opacity="0.03">
    <circle cx="60" cy="70" r="1.4"/><circle cx="420" cy="52" r="1.2"/><circle cx="390" cy="410" r="1.5"/>
    <circle cx="70" cy="400" r="1.2"/><circle cx="250" cy="30" r="1.1"/><circle cx="430" cy="240" r="1.3"/>
    <circle cx="40" cy="230" r="1.2"/><circle cx="210" cy="450" r="1.4"/><circle cx="330" cy="60" r="1"/>
  </g>
  <!-- double frame -->
  <rect x="28" y="28" width="424" height="424" fill="none" stroke="#2f2b26" stroke-width="3"/>
  <rect x="42" y="42" width="396" height="396" fill="none" stroke="#2f2b26" stroke-width="1"/>
  <!-- clay accent rule -->
  <rect x="150" y="96" width="180" height="5" fill="#a4552e"/>
  <!-- the delta -->
  <text x="240" y="278" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="190" fill="#2f2b26">δ</text>
  <!-- caption -->
  <text x="240" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" letter-spacing="10" fill="#2f2b26">PROFE DIRAC</text>
  <!-- small bra-ket signature -->
  <text x="240" y="400" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="21" fill="#a4552e">⟨ψ|φ⟩</text>
  <rect x="150" y="420" width="180" height="5" fill="#a4552e"/>
</svg>
